# Enviroment variables/secrets that are needed
# More information in the README.md

name: e2e-Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        description: 'the ref for the repo checkout step'
        default: ''
        required: false
        type: string
      skip:
        description: 'skip all jobs (e.g. for doc-only changes); workflow still runs to satisfy branch protection'
        default: false
        required: false
        type: boolean
    secrets:
      HANA_BINDINGS:
        required: true

permissions:
  contents: read

jobs:
  e2e-tests:
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    # All e2e runs share one HANA DB, so serialize them repo-wide. queue: max keeps
    # every waiting run (default would cancel all but the newest pending one).
    concurrency:
      group: hana-shared-db-e2e
      queue: max
    environment:
      name: pr-e2e-no-approval
      deployment: false
    steps:
      - name: checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          #use inputs.checkout-ref to be able to call it from a pull_request_target workflow, since there it needs to be github.event.pull_request.head.sha and not the default
          ref: ${{ inputs.checkout-ref }}
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'

      - name: Run build and e2e test
        run: make e2e.run
        env:
          HANA_BINDINGS: ${{ secrets.HANA_BINDINGS }}
